name: Apply GF Bible Stage1

on:
  push:
    branches:
      - gf-bible-update-20260907
    paths:
      - scripts/gf-bible-stage1.mjs
      - .github/workflows/apply-gf-bible-stage1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gf-bible-update-20260907
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply App.js patch
        run: node scripts/gf-bible-stage1.mjs

      - name: Syntax check patch script
        run: node --check scripts/gf-bible-stage1.mjs

      - name: Commit App.js changes
        shell: bash
        run: |
          if git diff --quiet -- App.js; then
            echo "No App.js changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js
          git commit -m "feat: connect GF Bible reading plans and Bible navigation"
          git push origin HEAD:gf-bible-update-20260907
