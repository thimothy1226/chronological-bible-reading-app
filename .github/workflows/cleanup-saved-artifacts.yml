name: Clean preserved GF Bible build artifacts
on:
  push:
    branches: [gf-bible-cleanup-20261101]
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify final release then delete only inventoried previous app build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = 'https://api.github.com/repos/thimothy1226/chronological-bible-reading-app'
          def api(path, method='GET'):
              request = urllib.request.Request(base+path, method=method, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request) as response:
                  data=response.read()
                  return json.loads(data) if data else None
          final_run = 41601465581
          final_artifact = 13215391713
          run=api(f'/actions/runs/{final_run}')
          assert run['conclusion']=='success' and run['head_sha']=='f5079994d29e9551d8ebde104c5e9ae6e5b5f0d8', 'Final release verification failed'
          final=api(f'/actions/artifacts/{final_artifact}')
          assert final['workflow_run']['id']==final_run and not final['expired'] and final['name']=='GF-Bible-v1.3.24-release-apk-aab-source'
          # Local downloads, SHA-256 checks and persistent final file saves were confirmed before this workflow was committed.
          candidates = [{"id":13069268383,"name":"GF-Bible-v1.3.19-release-aab","size":90791763,"run_id":41271787591},{"id":13063501993,"name":"GF-Bible-v1.3.22-release-apk-aab-source","size":199628572,"run_id":41256434356},{"id":13067786473,"name":"GF-Bible-v1.3.23-release-apk-aab-source","size":199639148,"run_id":41266416366}]
          print('Inventoried deletion candidates', json.dumps(candidates))
          count=0; total=0
          for candidate in candidates:
              try: item=api('/actions/artifacts/'+str(candidate['id']))
              except urllib.error.HTTPError as error:
                  if error.code==404: continue
                  raise
              assert item['id']!=final_artifact and item['name']==candidate['name'] and item['size_in_bytes']==candidate['size']
              assert item['workflow_run']['id']==candidate['run_id'] and item['workflow_run']['repository_id']==1351304778
              assert item['name'].startswith('GF-Bible-v1.3.') and (item['name'].endswith('-release-aab') or item['name'].endswith('-release-apk-aab-source'))
              assert item['created_at'] < final['created_at']
              api('/actions/artifacts/'+str(item['id']), 'DELETE')
              count+=1; total+=item['size_in_bytes']
              print('Deleted previous build artifact',item['id'],item['name'])
          print(json.dumps({'deleted_artifacts':count,'deleted_bytes':total,'preserved_final_artifact':final_artifact}))
          caches=api('/actions/caches?per_page=100')
          print('Cache inventory', json.dumps(caches))
          assert caches['total_count']<=100, 'More cache pages need review'
          for cache in caches['actions_caches']:
              assert cache['created_at'] < final['created_at'], 'Newer cache requires review'
          for cache in caches['actions_caches']:
              api('/actions/caches/'+str(cache['id']), 'DELETE')
              print('Deleted cache',cache['id'],cache['key'],cache['size_in_bytes'])
          print('Remaining cache count',api('/actions/caches?per_page=100')['total_count'])
          print('Remaining artifact inventory',json.dumps(api('/actions/artifacts?per_page=100')))
          PY
