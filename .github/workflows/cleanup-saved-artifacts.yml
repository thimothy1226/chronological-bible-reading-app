name: Clean preserved GF Bible build artifacts
on:
  push:
    branches: [gf-bible-cleanup-20261101]
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify final release and remove archived previous build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base='https://api.github.com/repos/thimothy1226/chronological-bible-reading-app'
          def api(path, method='GET'):
              req=urllib.request.Request(base+path, method=method, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as res:
                  data=res.read()
                  return json.loads(data) if data else None
          run=api('/actions/runs/44293615443')
          assert run['conclusion']=='success' and run['head_sha']=='bef6c1094c5d2e648621548ade3123b37a3b3adb'
          final=api('/actions/artifacts/14422173129')
          assert final['name']=='GF-Bible-v1.3.27-release-apk-aab-source' and final['size_in_bytes']==202403652 and not final['expired']
          # Complete source history and current/previous release backups were preserved.
          # The two older binaries are superseded by the preserved 1.3.26 rollback release.
          deleted=0
          candidates=[(13220669003,'GF-Bible-v1.3.19-release-aab',90791758,41614802126),(13215391713,'GF-Bible-v1.3.24-release-apk-aab-source',199646141,41601465581)]
          for artifact_id,name,size,run_id in candidates:
              try: old=api('/actions/artifacts/'+str(artifact_id))
              except urllib.error.HTTPError as e:
                  if e.code==404: continue
                  raise
              assert old['name']==name and old['size_in_bytes']==size and old['workflow_run']['id']==run_id
              assert old['created_at']<final['created_at'] and artifact_id!=14422173129
              api('/actions/artifacts/'+str(artifact_id),'DELETE')
              deleted+=old['size_in_bytes']
          caches=api('/actions/caches?per_page=100')
          assert caches['total_count']<=100
          # Caches are reproducible. Retain any generated after the release artifact.
          reclaimed=0
          for c in caches['actions_caches']:
              if c['created_at']<final['created_at']:
                  api('/actions/caches/'+str(c['id']),'DELETE')
                  reclaimed+=c['size_in_bytes']
          print(json.dumps({'deleted_artifact_bytes':deleted,'deleted_cache_bytes':reclaimed,'preserved_artifact':14422173129}))
          remaining=api('/actions/artifacts?per_page=100')
          print(json.dumps({'remaining_artifact_count':remaining['total_count'],'remaining_artifacts':[{'id':a['id'],'name':a['name'],'bytes':a['size_in_bytes']} for a in remaining['artifacts']]}))
          PY
