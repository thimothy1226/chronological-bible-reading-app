name: Apply GF Bible Stage6

on:
  push:
    branches: [gf-bible-update-20260907]
    paths:
      - 'scripts/gf-bible-stage6.mjs'
      - '.github/workflows/apply-gf-bible-stage6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gf-bible-update-20260907
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check patch
        run: node --check scripts/gf-bible-stage6.mjs
      - name: Apply App.js patch
        run: node scripts/gf-bible-stage6.mjs
      - name: Commit App.js changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js
          if git diff --cached --quiet; then
            echo "No App.js changes"
            exit 0
          fi
          git commit -m "fix: admin login, highlights and reader safe areas"
          git push origin gf-bible-update-20260907
