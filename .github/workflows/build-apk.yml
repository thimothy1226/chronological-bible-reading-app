name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Download KRV Bible data
        shell: bash
        run: |
          mkdir -p assets/bibles
          curl -fL --retry 3             "https://raw.githubusercontent.com/bluesaurel/Korean-Bible-1961-KRV/main/bible_1961_krv.json"             -o assets/bibles/krv.json
          echo "Downloaded KRV data:"
          ls -lh assets/bibles/krv.json
          test -s assets/bibles/krv.json

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android

      - name: Verify KRV Bible data before release build
        shell: bash
        run: |
          echo "Checking Bible data before Metro bundling..."
          ls -lh assets/bibles/krv.json
          test -s assets/bibles/krv.json

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk "output/연대기별-성경통독-일정표-v2.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronological-bible-reading-v2-release-apk
          path: output/*.apk
          retention-days: 30
