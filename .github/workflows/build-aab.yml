name: Build GF Bible Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - gf-bible-v1.3.0-final-source

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Validate GF Bible source
        run: npm run validate

      - name: Verify Firebase Functions syntax
        run: npm --prefix functions run check

      - name: Download KRV Bible data
        shell: bash
        run: |
          mkdir -p assets/bibles
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/bluesaurel/Korean-Bible-1961-KRV/main/bible_1961_krv.json" \
            -o assets/bibles/krv.json
          test -s assets/bibles/krv.json

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android

      - name: Restore upload signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gfbible-upload-key.jks"
          test -s "$RUNNER_TEMP/gfbible-upload-key.jks"

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/gfbible-upload-key.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Verify AAB signature
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare AAB
        run: |
          mkdir -p output
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "output/GF-Bible-v${{ steps.app_version.outputs.version }}-release.aab"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: GF-Bible-v${{ steps.app_version.outputs.version }}-release-aab
          path: output/*.aab
          retention-days: 30
