name: Deploy GF Bible Firebase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: gf-bible-update-20260907

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI and function dependencies
        run: |
          npm install -g firebase-tools
          npm install --prefix functions

      - name: Validate Firebase Functions syntax
        run: node --check functions/index.js

      - name: Deploy Functions and Firestore rules
        run: firebase deploy --only functions,firestore:rules --project gfc-bible-reading --non-interactive
