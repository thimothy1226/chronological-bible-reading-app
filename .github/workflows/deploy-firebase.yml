name: Deploy GF Bible Firebase

on:
  push:
    branches:
      - gf-bible-v1.3.0-final-source
    paths:
      - functions/**
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-firebase.yml
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'functions / rules / all'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - functions
          - rules

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions dependencies
        run: npm --prefix functions install

      - name: Check Functions syntax
        run: npm --prefix functions run check

      - name: Deploy Functions and Firestore rules
        if: ${{ github.event_name == 'push' || inputs.deploy_target == 'all' }}
        run: firebase deploy --only functions,firestore:rules --project gfc-bible-reading
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Functions only
        if: ${{ inputs.deploy_target == 'functions' }}
        run: firebase deploy --only functions --project gfc-bible-reading
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Firestore rules only
        if: ${{ inputs.deploy_target == 'rules' }}
        run: firebase deploy --only firestore:rules --project gfc-bible-reading
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
