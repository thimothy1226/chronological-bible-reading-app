name: GF Bible 1.3.27 verified release
on:
  push:
    branches: [gf-bible-v1.3.27-reader-community]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix .sync-test --no-audit --no-fund @babel/parser firebase-admin@13.6.0 firebase-functions@6.6.0 firebase@12.18.0 @firebase/rules-unit-testing@5.0.0 firebase-tools@14.17.0
      - env:
          NODE_PATH: ${{ github.workspace }}/.sync-test/node_modules
        run: |
          npm run final:check
          node scripts/validate-sync-syntax.js
          node --test tests/personal-sync.test.js tests/homologia-reflow.test.js tests/reader-anchor.test.js
          .sync-test/node_modules/.bin/firebase emulators:exec --config firebase.sync-test.json --only firestore --project demo-gf-sync 'npm run test:sync:server'
  build:
    needs: validate
    uses: ./.github/workflows/build-aab.yml
    secrets: inherit
  community:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix functions install --no-audit --no-fund
      - run: npm install --prefix .deploy-tools firebase-tools@14.17.0 --no-audit --no-fund
      - name: Deploy linked group synchronization only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: .deploy-tools/node_modules/.bin/firebase deploy --non-interactive --project gfc-bible-reading --only functions:syncLinkedCommunity,functions:onLinkedMembershipWritten
